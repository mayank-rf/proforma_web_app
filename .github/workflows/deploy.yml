name: Build and Deploy Next.js App to Azure Web App - son-eus2-proforma-app01

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '18.x'

            - name: Install dependencies
              run: npm ci

            - name: Build Next.js App
              run: npm run build

            - name: Create deployment package (standalone)
              run: |
                  mkdir deploy
                  cp -r .next/standalone/* deploy/
                  cp package.json deploy/
                  cd deploy && zip -r ../release.zip .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: nextjs-app
                  path: release.zip

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: 'Production'
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: nextjs-app

            - name: Unzip artifact
              run: unzip release.zip

            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v3
              with:
                  app-name: 'son-eus2-proforma-app01'
                  slot-name: 'Production'
                  package: .
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_63E3FCDEF32E4113A70986F8721CBBD6 }}
