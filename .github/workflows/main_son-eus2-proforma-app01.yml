name: 🚀 Deploy Next.js SSR App to Azure Web App - son-eus2-proforma-app01

on:
  workflow_dispatch:
  push:
    branches:
      - main # You can change this to your default branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Build Next.js app
        run: npm run build

      - name: 📁 Prepare deployment package
        run: |
          mkdir -p deploy/.next/static
          cp -r .next/standalone/* deploy/
          cp -r .next/static/* deploy/.next/static
          cp -r public deploy/public
          cp package.json deploy/
          cd deploy && zip -r ../app.zip .

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: ⬇️ Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app

      - name: 📦 Unzip artifact
        run: unzip -o app.zip -d deploy

      - name: 🚀 Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'son-eus2-proforma-app01'
          slot-name: 'Production'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_63E3FCDEF32E4113A70986F8721CBBD6 }}
